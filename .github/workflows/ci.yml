
  name: Hospital Management System CI/CD

  on:
    push:
      branches:
        - main
    pull_request:
      branches:
        - main

  permissions:
    contents: read
    packages: write

  jobs:

    backend:
      name: Backend Build and Test
      runs-on: ubuntu-latest

      steps:
        - name: Checkout source code
          uses: actions/checkout@v4

        - name: Set up Java 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
            cache: maven

        - name: Build and test backend
          working-directory: hospital-management-system
          run: mvn clean verify


    frontend:
      name: Frontend Build
      runs-on: ubuntu-latest

      steps:
        - name: Checkout source code
          uses: actions/checkout@v4

        - name: Set up Node.js 20
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: npm
            cache-dependency-path: Frontend/package-lock.json

        - name: Install dependencies
          working-directory: Frontend
          run: npm ci

        - name: Build frontend
          working-directory: Frontend
          run: npm run build


    docker:
      name: Build and Push Docker Images
      runs-on: ubuntu-latest

      needs:
        - backend
        - frontend

      steps:
        - name: Checkout source code
          uses: actions/checkout@v4

        - name: Log in to GitHub Container Registry
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Convert repository owner to lowercase
          id: lowercase
          run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

        - name: Build and push backend image
          uses: docker/build-push-action@v6
          with:
            context: ./hospital-management-system
            push: true
            tags: |
              ghcr.io/${{ steps.lowercase.outputs.owner }}/hospital-management-system-backend:latest
              ghcr.io/${{ steps.lowercase.outputs.owner }}/hospital-management-system-backend:${{ github.sha }}

        - name: Build and push frontend image
          uses: docker/build-push-action@v6
          with:
            context: ./Frontend
            push: true
            tags: |
              ghcr.io/${{ steps.lowercase.outputs.owner }}/hospital-management-system-frontend:latest
              ghcr.io/${{ steps.lowercase.outputs.owner }}/hospital-management-system-frontend:${{ github.sha }}

